<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#231a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>喵不可罐：抓開宇宙的縫</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;800&display=swap">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <canvas id="ov"></canvas>
  <div id="slit" hidden></div>
  <div id="caps"></div>

  <div class="hud" id="hud" hidden>
    <div class="chip" id="formChip"><span id="formName">普通貓</span><div class="bar"><i id="ebar"></i></div><span id="eNum">100</span></div>
    <div class="chip" id="sneakChip" hidden>輕腳中</div>
    <div class="chip goal" id="goal"></div>
    <div class="chip" id="seamChip" hidden>貓縫　<span id="seamT"></span></div>
    <div class="chip" id="canChip" hidden><span id="canTxt"></span></div>
    <div class="chip" id="itemChip" hidden></div>
    <div class="chip" id="tickChip" hidden></div>
    <div class="chip" id="ambChip" hidden></div>
    <div class="chip" id="locks" hidden></div>
    <div class="chip lvl" id="lvl" hidden></div>
    <div class="chip alert" id="alert"><span class="shape"></span><span id="alertTxt">沒被注意</span></div>
    <button id="btnPause" aria-label="暫停">II</button>
  </div>
  <div id="toast" hidden></div>
  <div id="prompt" hidden><span id="promptTxt"></span><i id="promptBar"></i></div>
  <div class="keys" id="keys" hidden></div>
  <div class="joy" id="joy" aria-label="移動搖桿" hidden><i></i></div>
  <div class="pad" id="pad" hidden>
    <div class="acts2">
      <button id="btnItem" hidden>道具</button>
    </div>
    <div class="forms" id="forms" hidden>
      <button id="f_normal" aria-pressed="true">普通<br>1</button>
      <button id="f_mini" aria-pressed="false">迷你<br>2</button>
      <button id="f_giant" aria-pressed="false">巨大<br>3</button>
      <button id="f_liquid" aria-pressed="false">液體<br>4</button>
      <button id="f_shadow" aria-pressed="false">影子<br>5</button>
    </div>
    <div class="acts"><button id="btnSneak" aria-pressed="false">輕腳</button><button id="btnMeow">喵</button><button id="btnE">互動</button></div>
  </div>

  <div class="ov" id="ovTitle">
    <div class="card">
      <h1>喵不可罐</h1>
      <p style="font-size:20px;font-weight:800">抓開宇宙的縫</p>
      <p class="en">Purrfect Heist: Seams of the Universe</p>
      <p id="titleSub">今晚整座宇宙都是我的罐罐</p>
      <div class="row"><button id="btnStart">開始遊戲</button><button id="btnLevels">選擇關卡</button><button id="btnOpts">設定</button><button id="btnEgg" hidden>空罐</button></div>
      <p class="small" id="audioState">按「開始」會同時開啟聲音。</p>
      <button id="btnAudioRetry" hidden>重試聲音</button>
    </div>
  </div>
  <div class="ov" id="ovLevels" hidden>
    <div class="card">
      <h2>選擇關卡</h2>
      <div class="col" id="lvList"></div>
      <p class="small" id="lvInfo"></p>
      <p class="small">解鎖新能力後，可以回舊關卡探索原本進不去的地方。</p>
      <button id="btnLvBack">返回</button>
    </div>
  </div>
  <div class="ov" id="ovPause" hidden>
    <div class="card">
      <h2 id="pauseTitle">暫停</h2>
      <div class="opts">
        <label class="wide">音樂 <input type="range" id="volM" min="0" max="100" value="55"></label>
        <label class="wide">音效 <input type="range" id="volS" min="0" max="100" value="70"></label>
        <label class="wide">視角靈敏度 <input type="range" id="sens" min="30" max="250" value="100"></label>
        <label><input type="checkbox" id="o_mute"> 靜音</label>
        <label><input type="checkbox" id="o_cap"> 聲音字幕與方向</label>
        <label><input type="checkbox" id="o_calm"> 減少畫面震動</label>
        <label><input type="checkbox" id="o_flash"> 減少閃光</label>
        <label><input type="checkbox" id="o_hints"> 目標指示與提示</label>
        <label><input type="checkbox" id="o_lowfx"> 減少特效（較順）</label>
        <label><input type="checkbox" id="o_cone"> 輔助：顯示狗的視線</label>
        <label><input type="checkbox" id="o_assist"> 輔助：BOSS 預告加長</label>
      </div>
      <div class="row"><button id="btnTest">測試音效</button><button id="btnResume">繼續</button><button id="btnRetryCp">回檢查點</button><button id="btnRestart">重玩本關</button><button id="btnQuit">回標題</button><button id="btnBack" hidden>返回</button></div>
      <button id="btnWipe" class="small">清除遊戲進度</button>
    </div>
  </div>
  <div class="ov" id="ovCaught" hidden>
    <div class="card">
      <h2 id="caughtTitle">被逮到了！</h2>
      <p id="gag"></p>
      <p id="why" style="color:var(--yolk)"></p>
      <button id="btnRetry">再試一次</button>
    </div>
  </div>
  <div class="ov" id="ovCut" hidden>
    <div class="card">
      <p id="cutTxt"></p>
      <p class="small" id="cutMore"></p>
    </div>
  </div>
  <div class="ov" id="ovResult" hidden>
    <div class="card">
      <h2 id="resTitle"></h2>
      <div class="stats" id="stats"></div>
      <p>稱號：<b id="rank" style="color:var(--yolk)"></b></p>
      <p id="unlock" style="color:var(--tuna)"></p>
      <div class="row"><button id="btnPractice">去練習區試新能力</button><button id="btnNext">前往下一關</button><button id="btnResTitle">回標題</button></div>
    </div>
  </div>
  <div class="ov" id="ovEnding" hidden>
    <div class="card">
      <h2 id="endTitle"></h2>
      <p id="endTxt"></p>
      <div class="row" id="endBtns"></div>
    </div>
  </div>
  <div id="rotate">
    <div class="card">
      <h2>把手機橫過來</h2>
      <p>橫著拿畫面比較大，左手移動、右手轉視角也比較順。</p>
      <button id="btnRotOk">先直著玩</button>
    </div>
  </div>
  <div class="ov" id="ovFatal" hidden>
    <div class="card"><h2>無法啟動</h2><p id="fatalTxt"></p></div>
  </div>
</div>

<script src="lib/three.min.js"></script>
<script src="lib/CopyShader.js"></script>
<script src="lib/LuminosityHighPassShader.js"></script>
<script src="lib/EffectComposer.js"></script>
<script src="lib/RenderPass.js"></script>
<script src="lib/ShaderPass.js"></script>
<script src="lib/UnrealBloomPass.js"></script>
<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/seams.js"></script>
<script src="js/player.js"></script>
<script src="js/dogs.js"></script>
<script src="js/boss.js"></script>
<script src="js/levels1.js"></script>
<script src="js/levels2.js"></script>
<script src="js/audio.js"></script>
<script src="js/gfx.js"></script>
<script src="js/models.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
